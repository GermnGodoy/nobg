

log_dir: "./runs/matting_512/logs/train.log"
checkpoint_dir: "./runs/matting_512/checkpoints"

model:
  use_refiner: true

# Load the existing SegFormer weights; initialize the refiner if none are included.
# A saved refiner checkpoint can also be used here to retain its learned weights.
pretrained: ./src/nobg/model/weights.pth
# To resume this experiment, select its checkpoint above and set this to true.
resume: false

augmentation:
  image_size: 512
  matting: true  
  hflip_prob: 0.5 
  vflip_prob: 0.2
  rotate_prob: 0.5
  crop_prob: 0.5
  crop_before_resize: true  # Crop the original image before reducing its detail.
  crop_scale: [0.5, 1.0]  # Retain 50-100% of the original image area.
  brightness_contrast_prob: 0.3
  rotate_limit: 20

# Expected layout: images/ and alphas/ inside each MAGICK split.
mask_path: "./images/MAGICK-TR/alphas"
image_path: "./images/MAGICK-TR/images"
val_mask_path: "./images/MAGICK-TE/alphas"
val_image_path: "./images/MAGICK-TE/images"

sample_images: true
sample_images_dir: "./runs/matting_512/sample"
sample_images_dpi: 160  # Keep the 512px contour details visible in the comparison.

training:
  # New fine-tuning phase: start at epoch 1 and evaluate over 20 epochs.
  epochs: 20
  batch_size: 4
  num_workers: 4
  shuffle: true
  steps: null  # Use every training batch, including with the smaller batch size.
  metrics: ["MAE", "MSE"]
  compare_original: true  # Metrics before the residual correction; the decoder now learns too.
  optimizer: "adamw"
  learning_rate: 0.0001
  # Train decoder and refiner together; the encoder remains frozen.
  refiner_phase: decoder
  refiner_learning_rate: 0.0001
  decoder_learning_rate: 0.00001
  min_lr: 1e-6
  boundary_kernel_size: 13  # Same relative band radius as 7x7 at 256px.
  loss:
    l1: 1.0
    gradient: 1.0
    dice: 0.0
    bce: 0.0
    boundary: 0.0  # Keep the binary contour loss disabled for matting.

seed: 2811
