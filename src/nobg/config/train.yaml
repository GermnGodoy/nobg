

log_dir: "./runs/logs/train.log"

model:
  use_refiner: true

# Optional .pth path (e.g. ./src/nobg/model/weights.pth).
# Full checkpoints resume the same phase; adding a refiner/changing phase loads only weights.
pretrained: ./src/nobg/model/weights.pth
resume: true  # Set false to load only weights, even within the same phase.

augmentation:
  image_size: 256
  hflip_prob: 0.5 
  vflip_prob: 0.2
  rotate_prob: 0.5
  crop_prob: 0.5
  brightness_contrast_prob: 0.3
  rotate_limit: 20

mask_path: "./images/DUTS-TR/DUTS-TR-Mask"
image_path: "./images/DUTS-TR/DUTS-TR-Image"

sample_images: true
sample_images_dir: "./runs/sample"

training:
  # Total number of epochs, including those completed in a loaded checkpoint.
  epochs: 80
  batch_size: 16
  num_workers: 4
  shuffle: true
  steps: 594
  metrics: ["Dice", "BCE", "False Positive", "True Positive"]
  optimizer: "adamw"
  learning_rate: 0.0001
  # With use_refiner: AdamW trains only the refiner by default.
  refiner_phase: refiner  # Optional second phase: decoder (encoder stays frozen).
  refiner_learning_rate: 0.0001
  decoder_learning_rate: 0.00001
  min_lr: 1e-6
  boundary_kernel_size: 7
  loss:
    dice: 0.5
    bce: 0.5
    boundary: 0.0  # Optional; use dice: 1, bce: 1, boundary: 0.5 for BCE + Dice + 0.5 BoundaryBCE.

seed: 2811
