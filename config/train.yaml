

log_dir: "./runs/logs/train.log"

model: 

pretrained:

augmentation:
  image_size: 256
  hflip_prob: 0.5 
  vflip_prob: 0.5
  rotate_prob: 0.5
  crop_prob: 0.5
  brightness_contrast_prob: 0.5
  rotate_limit: 45

mask_path: "./images/DUTS-TR/DUTS-TR-Mask"
image_path: "./images/DUTS-TR/DUTS-TR-Image"

sample_images: true
sample_images_dir: "./runs/sample"

training:
  epochs: 2
  batch_size: 16
  num_workers: 4
  shuffle: true
  steps: 100
  metrics: ["Dice", "False Positive", "True Positive"]
  optimizer: "adam"
  learning_rate: 0.001

seed: 2811