

log_dir: "./runs/logs/train.log"

model: 

# Optional .pth path: full checkpoints resume training; old files load only weights.
pretrained:

augmentation:
  image_size: 256
  hflip_prob: 0.5 
  vflip_prob: 0.2
  rotate_prob: 0.5
  crop_prob: 0.5
  brightness_contrast_prob: 0.3
  rotate_limit: 20

mask_path: "./images/DUTS-TR/DUTS-TR-Mask"
image_path: "./images/DUTS-TR/DUTS-TR-Image"

sample_images: true
sample_images_dir: "./runs/sample"

training:
  # Total number of epochs, including those completed in a loaded checkpoint.
  epochs: 80
  batch_size: 16
  num_workers: 4
  shuffle: true
  steps: 594
  metrics: ["Dice", "False Positive", "True Positive"]
  optimizer: "adam"
  learning_rate: 0.0003

seed: 2811
